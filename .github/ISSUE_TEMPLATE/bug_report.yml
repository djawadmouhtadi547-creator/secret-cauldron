name: Bug report
description: Report a reproducible problem in Prime Launcher.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Never include access tokens, Microsoft account data, or private log contents.
  - type: input
    id: version
    attributes:
      label: Prime Launcher version
      placeholder: 0.4.0-beta.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Ubuntu / Debian
        - Fedora
        - Arch Linux
        - Other Linux
        - macOS (not currently supported)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest set of steps that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
      description: Remove usernames, paths, tokens, account identifiers, and other personal data.
    validations:
      required: true
